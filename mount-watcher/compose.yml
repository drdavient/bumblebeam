services:
  mount-rebooter:
    build: .
    container_name: mount-rebooter
    pid: host
    privileged: true
    volumes:
      # NO /mnt/Elements bind here: when the drive is absent the bind fails and
      # the container never starts — exactly the case this service must handle.
      # All disk checks go through nsenter into the host mount namespace.
      - /var/log/mount-rebooter:/var/log/mount-rebooter
      - /var/lib/mount-rebooter:/state
    environment:
      ALERT_URL: ""    # fill later with n8n webhook
    restart: "no"
