services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: bumblebeam
    restart: unless-stopped
    # Host networking: Syncthing sits directly on the LAN, so local discovery
    # and broadcasts work natively — phones/laptops find "bumblebeam" without
    # static addresses. The UI is reverse-proxied by the traefik FILE provider
    # (traefik/dynamic.yml -> http://192.168.1.15:8384), not docker labels.
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
      STNODEFAULTFOLDER: "true"
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - ./config:/var/syncthing/config
      # General share area: anything Syncthing serves lives under ./data
      # (first share: data/phones/winter — the Plex-driven phone pipeline).
      - ./data:/data
