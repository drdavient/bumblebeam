services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: bumblebeam
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
      STNODEFAULTFOLDER: "true"
    volumes:
      - ./config:/var/syncthing/config
      # General share area: anything Syncthing serves lives under ./data
      # (first share: data/phones/winter — the Plex-driven phone pipeline).
      - ./data:/data
    ports:
      # Sync protocol + local discovery. The container announces its bridge
      # IP, so LAN peers should use a static address: tcp://192.168.1.15:22000
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    networks:
      - traefik-net
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.syncthing.rule: "Host(`syncthing`, `syncthing.svc.home.arpa`)"
      traefik.http.routers.syncthing.entrypoints: web
      traefik.http.services.syncthing.loadbalancer.server.port: "8384"

networks:
  traefik-net:
    external: true
