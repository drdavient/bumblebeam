<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Bumblebeam · Health</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <nav class="tabs" aria-label="Portal sections">
        <a class="tab" href="index.html">Services</a>
        <a class="tab" href="health.html" aria-current="page">Health</a>
      </nav>

      <header class="hero hero--compact">
        <p class="eyebrow">Bumblebeam · Home Infrastructure</p>
        <h1>Health</h1>
        <p class="lede">
          <span id="summary" role="status">Checking services…</span>
          <button id="refresh" class="refresh" type="button">Refresh now</button>
        </p>
      </header>

      <noscript><p class="lede">JavaScript is required for live health checks.</p></noscript>

      <section aria-labelledby="health-home">
        <div class="section-heading">
          <p class="section-label">Home</p>
          <h2 id="health-home">Everyday services</h2>
        </div>
        <div class="grid" id="group-home"></div>
      </section>

      <section aria-labelledby="health-media">
        <div class="section-heading">
          <p class="section-label">Media</p>
          <h2 id="health-media">Library and downloads</h2>
        </div>
        <div class="grid" id="group-media"></div>
      </section>

      <section aria-labelledby="health-platform">
        <div class="section-heading">
          <p class="section-label">Operations</p>
          <h2 id="health-platform">Platform</h2>
        </div>
        <div class="grid" id="group-platform"></div>
      </section>
    </main>
    <script src="health.js"></script>
  </body>
</html>
