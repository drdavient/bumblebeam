# Bumblebeam portal — static site + same-origin health probes.
# Each /health-api/<service> location proxies one unauthenticated health
# endpoint so health.js can poll every service without CORS. Any HTTP answer
# (2xx/3xx/4xx) means the service is up; nginx 502/504 means it is not.
# Container-name upstreams use a variable + the Docker resolver so nginx
# still starts (and the rest of the portal works) when a container is absent.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    location / {
        try_files $uri $uri/ =404;
    }

    # Host-published ports (host-network services and Gluetun's published ports).
    location = /health-api/plex        { proxy_pass http://192.168.1.15:32400/identity; }
    # Host port 8123 is firewalled to Traefik's IP alone (matching HA's
    # trusted_proxies), so probe Home Assistant through Traefik — the same
    # path browsers take.
    location = /health-api/hass {
        set $u_traefik_hass traefik;
        proxy_set_header Host hass.svc.home.arpa;
        proxy_pass http://$u_traefik_hass:80/;
    }
    location = /health-api/syncthing   { proxy_pass http://192.168.1.15:8384/rest/noauth/health; }
    location = /health-api/sonarr      { proxy_pass http://192.168.1.15:8989/ping; }
    location = /health-api/radarr     { proxy_pass http://192.168.1.15:7878/ping; }
    location = /health-api/prowlarr    { proxy_pass http://192.168.1.15:9696/ping; }
    location = /health-api/bookshelf   { proxy_pass http://192.168.1.15:8787/ping; }
    location = /health-api/deluge      { proxy_pass http://192.168.1.15:8112/; }
    location = /health-api/flaresolverr { proxy_pass http://192.168.1.15:8191/; }
    location = /health-api/shelfarr    { proxy_pass http://192.168.1.15:5056/up; }

    # traefik-net neighbours, addressed by container DNS name.
    location = /health-api/seerr          { set $u_seerr seerr;       proxy_pass http://$u_seerr:5055/api/v1/status; }
    location = /health-api/audiobookshelf { set $u_abs audiobookshelf; proxy_pass http://$u_abs:80/healthcheck; }
    location = /health-api/zigbee2mqtt   { set $u_z2m zigbee2mqtt;    proxy_pass http://$u_z2m:8080/; }
    location = /health-api/n8n           { set $u_n8n n8n;            proxy_pass http://$u_n8n:5678/healthz; }
    location = /health-api/traefik {
        set $u_traefik traefik;
        proxy_set_header Host traefik.svc.home.arpa;
        proxy_pass http://$u_traefik:80/;
    }
}
