# Hardware watchdog (iTCO on the NUC's PCH) — ADR 0016.
# RuntimeWatchdogSec: PID 1 pings the watchdog; a hung kernel/PID1 hard-resets
# in 2min. RebootWatchdogSec: re-armed by systemd-shutdown, covers the
# post-journal shutdown window up to a kernel that fails to reset (3min).
# Neither survives a completed platform reset — a BIOS/POST hang still needs
# the power button; that asymmetry is itself diagnostic (see ADR 0016).
[Manager]
RuntimeWatchdogSec=2min
RebootWatchdogSec=3min
